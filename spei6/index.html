<script>
	
	    // Inicializace ročních selektorů (1991 až 2026 na základě 428 měsíců)
    const START_ROK = 1991;
    const CELKEM_MESICU = 428;
    const KONEC_ROK = START_ROK + Math.floor(CELKEM_MESICU / 12);

    const selectOd = document.getElementById("rok_od");
    const selectDo = document.getElementById("rok_do");

    for(let r = START_ROK; r <= KONEC_ROK; r++) {
        selectOd.options[selectOd.options.length] = new Option(r, r);
        selectDo.options[selectDo.options.length] = new Option(r, r);
    }
    selectDo.value = KONEC_ROK;
    
    
function resetLokalitaSelect() {
    const lokalitaSelect = document.getElementById("lokalita");
    lokalitaSelect.value = "CUSTOM";
	lokalitaSelect.selectedOptions[0].dataset.name = "Zeměpisné souřadnice: " + document.getElementById("gps_vstup").value;
}

function aplikujPrednastavenouLokalitu() {
    const lokalitaSelect = document.getElementById("lokalita");
    const val = lokalitaSelect.value;
    
    if (val === "CUSTOM") return;
    
    if (val === "CELA_KASKADA") {
        document.getElementById("gps_vstup").value = "CELA_KASKADA";
    } else {
        const casti = val.split(",");
        if (casti.length === 4 && casti[0] === casti[1] && casti[2] === casti[3]) {
            // Pokud jsou v optionu min/max stejné (bod), zjednodušíme výpis pro uživatele na 2 čísla
            document.getElementById("gps_vstup").value = `${casti[0]}, ${casti[2]}`;
        } else {
            // Jinak vypíšeme celý obdélník oddělený čárkami
            document.getElementById("gps_vstup").value = casti.join(", ");
        }
    }
    
    nactiData();
}
    


async function nactiData() {
    const gpsVstup = document.getElementById("gps_vstup").value.trim();
    const rokOd = parseInt(document.getElementById("rok_od").value);
    const rokDo = parseInt(document.getElementById("rok_do").value);

    try {
		
    const canvas = document.getElementById("graf");
    canvas.style.display = "none";
    const nacitani = document.getElementById("nacitam");
    nacitani.style.display = "block";
		
        let finalniSloučenáData = Array(CELKEM_MESICU).fill(0);

        // Definice 4 hlavních povodí s jejich přesnými zeměpisnými rozsahy a dlouhodobými hydrologickými váhami
        const definiceKaskady = [
            { latMin: 48.50, latMax: 48.90, lonMin: 13.70, lonMax: 14.40, vaha: 0.22 }, // Horní Vltava
            { latMin: 48.95, latMax: 49.40, lonMin: 13.40, lonMax: 14.20, vaha: 0.18 }, // Otava
            { latMin: 49.50, latMax: 50.05, lonMin: 12.80, lonMax: 14.00, vaha: 0.36 }, // Berounka
            { latMin: 49.35, latMax: 49.95, lonMin: 14.40, lonMax: 15.80, vaha: 0.24 }  // Sázava
        ];

        // --- REŽIM 1: CELÉ POVODÍ VLTAVY (VÁŽENÝ KOMPOZIT) ---
        if (gpsVstup === "CELA_KASKADA") {
            const docasnaVazenaData = Array(CELKEM_MESICU).fill(0);
            const sumaVahVMesici = Array(CELKEM_MESICU).fill(0);

            for (const povodi of definiceKaskady) {
                const dataPovodi = Array(CELKEM_MESICU).fill(0);
                const countPixelu = Array(CELKEM_MESICU).fill(0);

                // Iterace přes mřížku pixelů v rámci daného sub-povodí
                for (let currentLat = povodi.latMin; currentLat <= povodi.latMax; currentLat += 0.25) {
                    for (let currentLon = povodi.lonMin; currentLon <= povodi.lonMax; currentLon += 0.25) {
                        try {
                            const poleDatPixelu = await stahniAAkceptujPixel(currentLat, currentLon);
                            for (let m = 0; m < CELKEM_MESICU; m++) {
                                if (poleDatPixelu[m] !== null) {
                                    dataPovodi[m] += poleDatPixelu[m];
                                    countPixelu[m]++;
                                }
                            }
                        } catch (e) { continue; } // Přeskočí případné chybové/neplatné body
                    }
                }

                // Přepočet na čistý průměr povodí a započtení hydrologické váhy řeky
                for (let m = 0; m < CELKEM_MESICU; m++) {
                    if (countPixelu[m] > 0) {
                        const cistyPrumerPovodi = dataPovodi[m] / countPixelu[m];
                        docasnaVazenaData[m] += (cistyPrumerPovodi * povodi.vaha);
                        sumaVahVMesici[m] += povodi.vaha;
                    }
                }
            }

            // Finální sloučení všech 4 subsystémů
            for (let m = 0; m < CELKEM_MESICU; m++) {
                if (sumaVahVMesici[m] > 0) {
                    finalniSloučenáData[m] = docasnaVazenaData[m] / sumaVahVMesici[m];
                } else {
                    finalniSloučenáData[m] = null;
                }
            }

        } else {
            // --- REŽIM 2 A 3: VLASTNÍ VSTUP UŽIVATELE (BOD NEBO OBDÉLNÍK Z TEXTBOXU) ---
            const souradnice = gpsVstup.split(",").map(num => parseFloat(num.trim()));
            
            if (souradnice.some(isNaN)) {
                throw new Error("Neplatný formát souřadnic. Zadejte čísla oddělená čárkou.");
            }

            let latMin, latMax, lonMin, lonMax;

            if (souradnice.length === 2) {
                // BOD -> převedeme na obdélník s nulovou velikostí
                latMin = latMax = souradnice[0];
                lonMin = lonMax = souradnice[1];
            } else if (souradnice.length === 4) {
                // OBDÉLNÍK
                latMin = souradnice[0];
                latMax = souradnice[1];
                lonMin = souradnice[2];
                lonMax = souradnice[3];
            } else {
                throw new Error("Zadejte buď 2 souřadnice (bod: Lat, Lon) nebo 4 souřadnice (obdélník: LatMin, LatMax, LonMin, LonMax).");
            }

            let poctyPixeluVMesici = Array(CELKEM_MESICU).fill(0);
            let docasnaSumaData = Array(CELKEM_MESICU).fill(0);

            // Výpočet průměru z libovolné uživatelské plochy či jednoho bodu
            for (let currentLat = Math.min(latMin, latMax); currentLat <= Math.max(latMin, latMax); currentLat += 0.25) {
                for (let currentLon = Math.min(lonMin, lonMax); currentLon <= Math.max(lonMin, lonMax); currentLon += 0.25) {
                    try {
                        const poleDatPixelu = await stahniAAkceptujPixel(currentLat, currentLon);
                        for (let m = 0; m < CELKEM_MESICU; m++) {
                            if (poleDatPixelu[m] !== null) {
                                docasnaSumaData[m] += poleDatPixelu[m];
                                poctyPixeluVMesici[m]++;
                            }
                        }
                    } catch (e) { continue; }
                }
            }

            for (let m = 0; m < CELKEM_MESICU; m++) {
                if (poctyPixeluVMesici[m] > 0) {
                    finalniSloučenáData[m] = docasnaSumaData[m] / poctyPixeluVMesici[m];
                } else {
                    finalniSloučenáData[m] = null;
                }
            }
        }

        // Časové oříznutí pole na základě vybraných let na ose X
        const startMesic = (rokOd - START_ROK) * 12;
        const konecMesic = ((rokDo - START_ROK) + 1) * 12;
        const filtrovanaData = finalniSloučenáData.slice(startMesic, konecMesic);

        // Vykreslení finálního grafu na Canvas
        vykresliGraf(filtrovanaData, rokOd, rokDo);
    nacitani.style.display = "none";
    canvas.style.display = "block";

    } catch (error) {
        alert("Chyba: " + error.message);
    }

}

// Pomocná funkce izolující stahování a dekompresi jednoho bodu
async function stahniAAkceptujPixel(lat, lon) {
    const response = await fetch(`get_data.php?lat=${lat}&lon=${lon}`);
    if (!response.ok) throw new Error("Chyba stahování");
    
    const compressedBuffer = await response.arrayBuffer();
    const stream = new Response(compressedBuffer).body.pipeThrough(new DecompressionStream("gzip"));
    const decompressedBuffer = await new Response(stream).arrayBuffer();
    const packedBytes = new Uint8Array(decompressedBuffer);

    const data4bit = [];
    for(let i = 0; i < packedBytes.length; i++) {
        data4bit.push(packedBytes[i] >> 4);
        data4bit.push(packedBytes[i] & 0x0F);
    }

    const X = Math.round((lon - (-179.875)) / 0.25);
    const Y = Math.round(((89.875) - lat) / 0.25);
    const local_x = X % 45;
    const local_y = Y % 45;
    
    const pixelHistory = [];
    const pixel_offset = (local_y * 45 + local_x) * CELKEM_MESICU;
    
    for(let m = 0; m < CELKEM_MESICU; m++) {
        const kod = data4bit[pixel_offset + m];
        const spei = (kod === 15) ? null : (kod / (14.0 / 8.0)) - 4.0;
        pixelHistory.push(spei);
    }
    return pixelHistory;
}


	
	
  function vykresliGraf(data, rokOd, rokDo) {
    const canvas = document.getElementById("graf");
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const paddingLeft = 50;
    const paddingRight = 20;
    const paddingTop = 60;
    const paddingBottom = 60;
    
    const graphWidth = canvas.width - paddingLeft - paddingRight;
    const graphHeight = canvas.height - paddingTop - paddingBottom;

    // 1. DEFINICE BAREVNÝCH PÁSEM INDEXU (Podle agronomického dopadu)
    const pasma = [
        { max: 4.0,  min: 2.0,  barvaPozadi: "rgba(13, 71, 161, 0.15)",  barvaCary: "#0d47a1", tloustka: 3, text: "Extrémní vlhko" },
        { max: 2.0,  min: 1.0,  barvaPozadi: "rgba(30, 136, 229, 0.1)",  barvaCary: "#1e88e5", tloustka: 1.5, text: "Mírné vlhko" },
        { max: 1.0,  min: -1.0, barvaPozadi: "rgba(255, 255, 255, 0)",    barvaCary: "#888888", tloustka: 1, text: "Normál" },
        { max: -1.0, min: -2.0, barvaPozadi: "rgba(255, 152, 0, 0.1)",   barvaCary: "#ff9800", tloustka: 2, text: "Mírné sucho" },
        { max: -2.0, min: -4.0, barvaPozadi: "rgba(211, 47, 47, 0.15)",   barvaCary: "#d32f2f", tloustka: 4, text: "Kritické sucho" }
    ];

    // Pomocné matematické funkce pro transformaci souřadnic do Canvasu
    const getX = (i) => paddingLeft + (i / (data.length - 1)) * graphWidth;
    const getY = (val) => {
        if (val === null) return paddingTop + graphHeight / 2;
        return paddingTop + graphHeight - ((val + 4) / 8) * graphHeight;
    };

    // 2. VYKRESLENÍ HORIZONTÁLNÍCH PÁSEM A OSY Y
    pasma.forEach(pasm => {
        const yTop = getY(pasm.max);
        const yBot = getY(pasm.min);
        
        // Vybarvení pozadí zóny tonální barvou
        ctx.fillStyle = pasm.barvaPozadi;
        ctx.fillRect(paddingLeft, yTop, graphWidth, yBot - yTop);

        // Hraniční čára
        ctx.strokeStyle = pasm.barvaCary;
        ctx.lineWidth = pasm.tloustka;
        ctx.beginPath();
        ctx.moveTo(paddingLeft, yBot);
        ctx.lineTo(paddingLeft + graphWidth, yBot);
        ctx.stroke();

        // Popisky na ose Y (Indexové hodnoty a texty pásem)
        ctx.fillStyle = pasm.barvaCary;
        ctx.font = "bold 16px sans-serif";
        ctx.textAlign = "right";
        ctx.fillText(pasm.min.toFixed(1), paddingLeft - 15, yBot + 5);
        
        ctx.font = "italic 14px sans-serif";
        ctx.textAlign = "left";
        ctx.fillText(pasm.text, paddingLeft + 15, yTop + (yBot - yTop) / 2 + 5);
    });

    // 3. DYNAMICKÁ OSA X (Měsíce a Roky)
    const mesiceNazvy = ["Led", "Úno", "Bře", "Dub", "Kvě", "Čer", "Čec", "Srp", "Září", "Říj", "Lis", "Pro"];
    const sirkaNaMesic = graphWidth / data.length;

    // Rozhodovací logika zobrazení podle dostupné šířky v pixelech
    let typZobrazeni = "nazev"; // výchozí
    if (sirkaNaMesic < 45)  typZobrazeni = "cislo";
    if (sirkaNaMesic < 15)  typZobrazeni = "index";
    if (sirkaNaMesic < 6)   typZobrazeni = "carka";
    if (sirkaNaMesic < 1.5) typZobrazeni = "vypustit";

    ctx.textAlign = "center";
    ctx.textBaseline = "top";

    for (let i = 0; i < data.length; i++) {
        const aktualniCelkovyMesic = (rokOd - START_ROK) * 12 + i;
        const rok = START_ROK + Math.floor(aktualniCelkovyMesic / 12);
