<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Projekce reálné evapotranspirace (EVSPSBL)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="leaflet.min.css">
    <script src="leaflet.min.js"></script>

<style>
    body { margin: 0; padding: 0; font-family: sans-serif; display: flex; height: 100vh; }
    #mapa-kontainer {  flex-grow: 1; height: 100%; margin: 0px; }
    .vegetacni-panel {
        position: relative; /* Nutné pro správné umístění táhla */
        height: 100%; 
        display: none; 
        flex-direction: column; 
        gap: 0px; 
        width: 35%;       /* Výchozí šířka panelu při načtení */
        min-width: 20%;   /* Minimální šířka */
        max-width: 90%;   /* maximální šířka */
        margin: 0px; 
        background: #fff; 
        padding: 0px 5px 0px 15px;
        overflow-y: auto;  
        opacity: 1;
        transition: width 0.2s;
    }
    .resizer {
        width: 8px;
        height: 100%;
        position: relative;
        background: #ddd;
        top: 0px;
        left: 0px;
        cursor: col-resize; /* Změní kurzor na šipky vlevo/vpravo */
        user-select: none;  /* Zabrání označování textu při tažení */
    }
    .resizer:hover { background: #d6d6d6; }
    .resizer2 {
        width: 17px;
        height: 30px;
        position: absolute;
        background: #ddd;
        left: 0px;
        top: 50%;
        transform: translate(0%, -50%);
        z-index: 1000;
        border-radius: 0px 4px 4px 0px;
    }
    .resizer3 {
        width: 100%;
        height: 30px;
        position: absolute;
        background: #cecdcd;
        right: 0px;
        cursor: pointer;
        user-select: none;
        border-radius: 2px 6px 6px 2px;
        opacity: 0.25;
        border: 0px solid rgba(255, 255, 255, 0);
        box-shadow: -1px -1px 3px #fafafa7a , 1px 1px 3px #0606067a , inset 7px 7px 12px #fafafa17 , inset -3px -7px 9px #06060621 , inset 7px 13px 13px #fafafa14 , inset -1px -1px 1px #06060652, inset 1px 1px 1px #fafafa4a;
        transition: box-shadow 0.1s, background 0.1s;
    }
    .resizer3:hover { 
        background: #42414140;
        box-shadow: -2px -2px 9px #06060600 , 2px 2px 9px #fff0 , inset 7px 7px 12px #0000001a, inset -3px -7px 9px #ffffff12 , inset -7px -13px 13px #ffffff08 , inset -1px -1px 1px #ffffffc7, inset 1px 1px 1px #0606065c;
        transition: box-shadow 0.1s, background 0.1s;
    }
    table.pudni-tabulka { width: 100%; border-collapse: collapse; margin-top: 0px; font-size: 12px; }
    table.pudni-tabulka th, table.pudni-tabulka td { border: 1px solid #ddd; padding: 3px; text-align: center; }
    table.pudni-tabulka th { background: #e4f0d6; color: #335e23; }
    .dominantni-info { color: #3d3d3d; margin-bottom: 15px; font-size: 14px; }
    .controls { margin-bottom: 5px; padding: 5px; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
    label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 4px; color: #444; }
    input, select, button { width: 100%; padding: 6px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
    button { background: #2e7d32; color: white; border: none; cursor: pointer; font-weight: bold; padding: 8px; margin-top: 15px; }
    button:hover { background: #1b5e20; }
</style>

</head>
<body>

<div id="mapa-kontainer"></div>

    <div class="resizer"><div class="resizer2"><div class="resizer3"></div></div></div>

<div class="vegetacni-panel">
	
    <h4 style="margin:10px;text-align: center;">Budoucí projekce celkové evapotranspirace (EVSPSBL)</h4>
    <h4 style="margin:0px 10px 10px 10px;text-align: center;">Celý program i s databází si můžete stáhnout na <a href="https://github.com/h8jek1-max/small_useful_programs" >Githubu</a></h4>
	
<div class="controls">
        
    <div style="grid-column: span 1;">
        <label style="display: inline-flex; align-items: center; cursor: pointer; margin-bottom: 4px;">
            <input type="checkbox" id="zobrazit" onchange="prekresliGslMapu()" style="width: auto; margin-right: 4px;" >
            Zobrazit mapa předpovědi
        </label>
    </div>
    
    <div style="grid-column: span 2;">
        <label>Zeměpisné souřadnice (GPS)</label>
        <input type="text" id="gps_vstup" value="50.08, 14.43" onchange="vynutObnoveniGrafu()" placeholder="Formát:  50.62,15.09">
    </div>
    
    <div>
        <label>Od roku</label>
        <select id="rok_od" onchange="vynutObnoveniGrafu()"></select>

        <label>Do roku</label>
        <select id="rok_do" onchange="vynutObnoveniGrafu()"></select>
    </div>
    
    <div style="grid-column: span 1;">
        <label style="display: inline-flex; align-items: center; cursor: pointer; margin-bottom: 4px;">
            Sledované období
        </label>
        <select id="trend_mesic" onchange="prekresliGslMapu(); vynutObnoveniGrafu();">
            <option value="ALL" selected>Celoroční průměr</option>
            <option value="CONTINUOUS">Všechny měsíce v řadě</option>
            <option value="0">Leden</option>
            <option value="1">Únor</option>
            <option value="2">Březen</option>
            <option value="3">Duben</option>
            <option value="4">Květen</option>
            <option value="5">Červen</option>
            <option value="6">Červenec</option>
            <option value="7">Srpen</option>
            <option value="8">Září</option>
            <option value="9">Říjen</option>
            <option value="10">Listopad</option>
            <option value="11">Prosinec</option>
        </select>
    </div>

    <div>
        <label>Trend (let)</label>
        <select id="trend_segment" onchange="prekresliGslMapu();vynutObnoveniGrafu()">
            <option value="NONE" selected>Nevypočítávat trend v mapě i v grafu</option>
            <option value="0">Celé období</option>
            <option value="3">Po 3 letech</option>
            <option value="5">Po 5 letech</option>
            <option value="10">Po 10 letech</option>
            <option value="15">Po 15 letech</option>
            <option value="20">Po 20 letech</option>
        </select>
        <label style="display: inline-flex; align-items: center; cursor: pointer; margin-top: 12px;">
            <input type="checkbox" id="rezim_percentil" onchange="vynutObnoveniGrafu()" style="width: auto; margin-right: 4px;"> Percentil
        </label>
    </div>
    
    <div style="grid-column: span 3;" id="gsl_casovy_panel">
        <label>Zvolený rok projekce pro zobrazení v mapě: <span id="gsl_rok_label" style="font-weight:bold; color:#e65100;">2015</span></label>
        <input type="range" id="gsl_rok_slider" min="2015" max="2099" value="2015" step="1" oninput="posunulSeRokProjekce()">
    </div>

    <!-- Dynamická legenda mapy -->
    <div id="mapa-legenda" class="pudni-panel" style="display:none; font-size:12px; grid-column: span 3; flex-direction: row;">
        <b id="legenda-titulek">Legenda:</b>
        <div id="legenda-barvy" style="display:flex; gap:3px; max-width: 410px; margin: 4px auto 0px auto;"></div>
    </div>

</div>

<div class="" id="gsl-graf-sekce" style="margin-top: 5px;">
    <canvas id="gslGraf" width="1600" height="600" style="cursor: pointer; border: 1px solid #ddd; background: #fff; width: 100%; height: auto; border-radius: 6px; display:none;" onclick="
    if (this.style.position === 'fixed') {
        this.style.position = ''; this.style.left = ''; this.style.top = ''; this.style.transform = 'translate(0%, 0%)'; this.style.zIndex = ''; this.style.boxShadow = '';
    } else {
        this.style.position = 'fixed'; this.style.left = '50%'; this.style.top = '50%'; this.style.transform = 'translate(-50%, -50%)'; this.style.zIndex = '1000'; this.style.boxShadow = '0px 0px 100px';
    }
"></canvas>
    <div class="dominantni-info" id="gsl-meta-info" >
        Kliknutím do mapy zobrazíte graf budoucího vývoje na daných souřadnicích.
    </div>
</div>
    
</div>

<script>
const panel = document.querySelector('.vegetacni-panel');
const resizer = document.querySelector('.resizer');
const resizer2 = document.querySelector('.resizer2');
const resizer3 = document.querySelector('.resizer3');
resizer.addEventListener('mousedown', initResize, false);
resizer2.addEventListener('mousedown', poz, false);

function poz() {
    if(panel.style.width !== "0px"){
        panel.style.opacity = "0";
        setTimeout( function () { 
            panel.style.minWidth = "0px";
            panel.style.width = "0px";
            panel.style.padding = "0px";
            resizer.style.width = "0px";
            resizer2.style.left = "-28px";
            resizer2.style.width = "25px";
            resizer2.style.transform = "scaleX(-1)";
            resizer3.style.opacity = "1";
            panel.style.transition = "width 0.2s"; 
        } , 50 );
    } else {
        panel.style.minWidth = "20%";
        panel.style.width = "35%";
        panel.style.padding = "0px 5px 0px 15px";
        resizer.style.width = "8px";
        resizer2.style.left = "0px";
        resizer2.style.width = "17px";
        resizer2.style.transform = "scaleX(1)";
        resizer3.style.opacity = "0.25";
        setTimeout( function () { panel.style.opacity = "1"; } , 200 );
    }
}

function initResize(e) {
    e.preventDefault();
    window.addEventListener('mousemove', StartResize, false);
    window.addEventListener('mouseup', StopResize, false);
}

function StartResize(e) {
    const panelRight = panel.getBoundingClientRect().right;
    const newWidth = panelRight - e.clientX;
    panel.style.width = newWidth + 'px';
}

function StopResize() {
    window.removeEventListener('mousemove', StartResize, false);
    window.removeEventListener('mouseup', StopResize, false);
}

// Inicializace ročních selektorů při startu podle časové osy TAS (2015-2099)
const START_ROK_TAS = 2015;
const CELKEM_MESICU_TAS = 1020; // 85 let x 12 měsíců

const selOd = document.getElementById("rok_od");
const selDo = document.getElementById("rok_do");
if (selOd && selDo && selOd.options.length === 0) {
    for (let r = START_ROK_TAS; r <= 2099; r++) {
        selOd.options[selOd.options.length] = new Option(r, r);
        selDo.options[selDo.options.length] = new Option(r, r);
    }
    selDo.value = 2099;
}

// =============================================================================
// CENTRALIZOVANÝ DATAMANAŽER S BOUNDING-BOX FRONTOU (ZERO-COPY BUFFER)
// =============================================================================
class GlobalniEvapoDataManager {
    constructor() {
        this.cache = new Map();
        this.frontaPožadavků = new Map();
        this.debounceTimer = null;
        this.odkladZpracovaniMs = 35;
        
        // Parametry Gaussovy mřížky pro klientský přepočet
        this.ncols = 256; this.nrows = 128;
        this.xdim = 1.40625; this.ydim = 1.40625;
        this.ulx = 0.0; this.uly = 88.92774;
    }
    
ziskejDataBodu(lat, lon) {
    const klic = `${parseFloat(lat).toFixed(4)}_${parseFloat(lon).toFixed(4)}`;
    
    if (this.cache.has(klic)) {
        return Promise.resolve(this.cache.get(klic));
    }
    if (this.frontaPožadavků.has(klic)) {
        return this.frontaPožadavků.get(klic).promise;
    }

    let deferred = {};
    deferred.promise = new Promise((resolve, reject) => {
        deferred.resolve = resolve;
        deferred.reject = reject;
    });

    // Uložíme do fronty objekt s deferred strukturou
    this.frontaPožadavků.set(klic, { lat, lon, promise: deferred.promise, deferred: deferred });
    this.naplánujOdesláníFronty();
    
    // KLÍČOVÁ OPRAVA: Nyní metoda striktně vrací Promise, takže .then() už nikdy neselže!
    return deferred.promise;
}


    naplánujOdesláníFronty() {
        if (this.debounceTimer) clearTimeout(this.debounceTimer);
        this.debounceTimer = setTimeout(() => this.odesliFrontuNaServer(), this.odkladZpracovaniMs);
    }

    async odesliFrontuNaServer() {
        if (this.frontaPožadavků.size === 0) return;

        const mistniKopieFronty = new Map(this.frontaPožadavků);
        this.frontaPožadavků.clear();

        // 1. Spočítáme minimální a maximální indexy mřížky pro celou frontu (Bounding Box)
let r_min = 128, r_max = 0, c_min = 256, c_max = 0;

mistniKopieFronty.forEach(polozka => {
    let cur_lon = polozka.lon;
    if (cur_lon < 0) cur_lon += 360.0;
    
    let col = Math.max(0, Math.min(this.ncols - 1, Math.round((cur_lon - this.ulx) / this.xdim)));
    let row = Math.max(0, Math.min(this.nrows - 1, Math.round((this.uly - polozka.lat) / this.ydim)));

    if (row < r_min) r_min = row; if (row > r_max) r_max = row;
    if (col < c_min) c_min = col; if (col > c_max) c_max = col;
});


        try {
            // 2. Voláme server s ultra-krátkou URL adresou (Bleskové vyříznutí matice)
            const res = await fetch(`get_evapo_bin.php?r_min=${r_min}&r_max=${r_max}&c_min=${c_min}&c_max=${c_max}`);
            if (!res.ok) throw new Error("Chyba síťového proudu");
            
            const buffer = await res.arrayBuffer();
            const surovaUint8Matice = new Uint8Array(buffer);

            // 3. Rozdistribuujeme surové bajty z vyříznutého obdélníku do paměti jednotlivých GPS klíčů
            const sirkaObdelniku = (c_max - c_min) + 1;

            mistniKopieFronty.forEach((polozka, klic) => {
                let cur_lon = polozka.lon;
                if (cur_lon < 0) cur_lon += 360.0;
                
                let col = Math.max(0, Math.min(this.ncols - 1, Math.round((cur_lon - this.ulx) / this.xdim)));
                let row = Math.max(0, Math.min(this.nrows - 1, Math.round((this.uly - polozka.lat) / this.ydim)));

                // Spočítáme, kde v přijatém obdélníku leží data tohoto konkrétního sub-pixelu
                const mistni_r = row - r_min;
                const mistni_c = col - c_min;
                const indexPixeluVObdelniku = (mistni_r * sirkaObdelniku) + mistni_c;
                const byteOffset = indexPixeluVObdelniku * CELKEM_MESICU_TAS;

                const kouskyBajtůBodu = surovaUint8Matice.subarray(byteOffset, byteOffset + CELKEM_MESICU_TAS);

                const rozbalenePoleMm = new Float32Array(CELKEM_MESICU_TAS);
                for (let j = 0; j < CELKEM_MESICU_TAS; j++) {
                    rozbalenePoleMm[j] = this.dekodujBajtEvapo(kouskyBajtůBodu[j]);
                }

                this.cache.set(klic, rozbalenePoleMm);
                polozka.deferred.resolve(rozbalenePoleMm);
            });

        } catch (err) {
            mistniKopieFronty.forEach(polozka => polozka.deferred.reject(err));
        }
    }

    dekodujBajtEvapo(bajt) {
        if (bajt === 255) return null;
        if (bajt <= 240) return bajt;
        switch(bajt) {
            case 241: return 248.0; case 242: return 265.0; case 243: return 288.0;
            case 244: return 315.0; case 245: return 348.0; case 246: return 385.0;
            case 247: return 428.0; case 248: return 475.0; case 249: return 525.0;
            case 250: return 575.0; default: return 600.0;
        }
    }
}

const gslKlientskaPamet = new GlobalniEvapoDataManager();
let gslTileLayerLeaflet = null;
let aktualniMarker = null;


// =============================================================================
// INICIALIZACE MAPY LEAFLET A MĚŘÍTKA
// =============================================================================
const map = L.map('mapa-kontainer').setView([50.62, 15.09], 9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 22, attribution: '© OpenStreetMap'
}).addTo(map);

L.control.scale({ position: 'bottomleft', metric: true, imperial: false }).addTo(map);

map.on('click', function(e) {
    const lat = e.latlng.lat.toFixed(4);
    const lon = e.latlng.lng.toFixed(4);
    const gpsVstup = document.getElementById("gps_vstup");
    if (gpsVstup) gpsVstup.value = `${lat}, ${lon}`;
    
    nactiGslHistoriiProGraf(lat, lon);
});

function posunulSeRokProjekce() {
    const aktivniRok = document.getElementById("gsl_rok_slider").value;
    document.getElementById("gsl_rok_label").innerText = aktivniRok;
    if (gslTileLayerLeaflet) gslTileLayerLeaflet.redraw();
}

function vynutObnoveniGrafu() {
    const gpsVstup = document.getElementById("gps_vstup").value;
    if (gpsVstup) {
        const castiGps = gpsVstup.split(',').map(num => parseFloat(num.trim()));
        if(castiGps.length === 2 && !isNaN(castiGps[0])) {
            const lat = castiGps[0].toFixed(4);
            const lon = castiGps[1].toFixed(4);
            nactiGslHistoriiProGraf(lat, lon);
        }
    }
}

// =============================================================================
// 3. ULTRA-PRECIZNÍ RASTROVÁNÍ MATICE EVAPOTRANSPIRACE (Opravený Bounding Box)
// =============================================================================
function prekresliGslMapu() {
    const vlastnost = document.getElementById("trend_mesic").value;
    const casovyPanel = document.getElementById("gsl_casovy_panel");
    const legPanel = document.getElementById("mapa-legenda");
    const legBarvy = document.getElementById("legenda-barvy");
    const zobraz = document.getElementById("zobrazit").checked;

    if (gslTileLayerLeaflet) { map.removeLayer(gslTileLayerLeaflet); gslTileLayerLeaflet = null; }
    if (legBarvy) legBarvy.innerHTML = "";

    if (!zobraz) {
        if (casovyPanel) casovyPanel.style.display = "none";
        if (legPanel) legPanel.style.display = "none";
        return;
    }
    
    if (casovyPanel) casovyPanel.style.display = "block";
    if (legPanel) legPanel.style.display = "block";

    const legendySkaly = [
        { min: 0,   max: 20,  barva: "rgb(13, 71, 161)",  t: "Nízká / Zimní <br>(< 20 mm)" },
        { min: 20,  max: 60,  barva: "rgb(46, 125, 50)",   t: "Mírná / Jarní <br>(20 - 60 mm)" },
        { min: 60,  max: 110, barva: "rgb(255, 235, 59)",  t: "Střední / Optimální <br>(60 - 110 mm)" },
        { min: 110, max: 160, barva: "rgb(255, 152, 0)",  t: "Vysoká / Letní <br>(110 - 160 mm)" },
        { min: 160, max: 601, barva: "rgb(211, 47, 47)",  t: "Extrémní odpar <br>(> 160 mm)" }
    ];
    legendySkaly.forEach(l => {
        legBarvy.innerHTML += `<div style="text-align: center; margin-right:15px; margin-top:5px; display:inline-block;"><div style="width:20px; height:15px; background:${l.barva}; margin:5px auto; border:1px solid #aaa;"></div><span>${l.t}</span></div>`;
    });

    document.getElementById("legenda-titulek").innerText = "Legenda: Projekce celkové evapotranspirace (mm/měsíc)";

    gslTileLayerLeaflet = L.gridLayer({ tileSize: 256, opacity: 0.45 });
    gslTileLayerLeaflet.createTile = function(coords) {
        const tile = L.DomUtil.create('canvas', 'leaflet-tile');
        const ctx = tile.getContext('2d');
        tile.width = tile.height = this.options.tileSize;

        const aktivniRok = parseInt(document.getElementById("gsl_rok_slider").value);
        const indexRoku = aktivniRok - START_ROK_TAS;
        const trendSegmentVolba = document.getElementById("trend_segment").value;
        const krok = 16; 

        const seznamSubPixelu = [];
        for (let y = 0; y < 256; y += krok) {
            for (let x = 0; x < 256; x += krok) {
                const gPoint = map.unproject([coords.x * 256 + x, coords.y * 256 + y], coords.z);
                seznamSubPixelu.push({ x, y, lat: gPoint.lat, lon: gPoint.lng });
            }
        }

        setTimeout(async () => {
            const slibyBodu = seznamSubPixelu.map(sp => 
                gslKlientskaPamet.ziskejDataBodu(sp.lat, sp.lon)
                    .then(data => ({ ...sp, data }))
                    .catch(() => ({ ...sp, data: null }))
            );

            const vysledkyBodu = await Promise.all(slibyBodu);

            vysledkyBodu.forEach(pb => {
                if (pb.data) {
                    const historieEvapo = pb.data;
                    const startMěsícRoku = indexRoku * 12;
                    let vyhlazeneMm = null;

                    let k_let = 0;
                    if (trendSegmentVolba !== "NONE" && trendSegmentVolba !== "0") {
                        k_let = Math.floor(parseInt(trendSegmentVolba) / 2);
                    } else if (trendSegmentVolba === "0") {
                        k_let = Math.floor((2099 - START_ROK_TAS) / 2);
                    }

                    if (vlastnost === "ALL" || vlastnost === "CONTINUOUS") {
                        let sumaRoku = 0, countRoku = 0;
                        const rStart = Math.max(0, indexRoku - k_let);
                        const rKonec = Math.min(Math.floor(historieEvapo.length / 12) - 1, indexRoku + k_let);
                        
                        for (let rIdx = rStart; rIdx <= rKonec; rIdx++) {
                            for (let m = 0; m < 12; m++) {
                                const v = historieEvapo[rIdx * 12 + m];
                                if (v !== null) { sumaRoku += v; countRoku++; }
                            }
                        }
                        vyhlazeneMm = countRoku > 0 ? (sumaRoku / countRoku) : null;
                    } else {
                        const cistyIndexMesice = startMěsícRoku + parseInt(vlastnost);
                        
                        if (trendSegmentVolba !== "NONE") {
                            let sumOkna = 0, countOkna = 0;
                            const sOkna = Math.max(parseInt(vlastnost), cistyIndexMesice - (k_let * 12));
                            const kOkna = Math.min(historieEvapo.length - 1, cistyIndexMesice + (k_let * 12));
                            
                            for (let j = sOkna; j <= kOkna; j += 12) {
                                // KOREKCE: Odstraněno chybné vnitřní rovnítko, porovnáváme čistě a bezpečně
                                if (historieEvapo[j] !== null && historieEvapo[j] !== undefined) { 
                                    sumOkna += historieEvapo[j]; 
                                    countOkna++; 
                                }
                            }
                            vyhlazeneMm = countOkna > 0 ? (sumOkna / countOkna) : historieEvapo[cistyIndexMesice];
                        } else {
                            vyhlazeneMm = historieEvapo[cistyIndexMesice];
                        }
                    }

                    if (vyhlazeneMm !== null && vyhlazeneMm !== undefined) {
                        const match = legendySkaly.find(l => vyhlazeneMm >= l.min && vyhlazeneMm < l.max);
                        if (match) {
                            const barva = match.barva; const stinRadius = 18;
                            const centerX = pb.x + krok / 2; const centerY = pb.y + krok / 2;
                            const gradient = ctx.createRadialGradient(centerX, centerY, krok / 2, centerX, centerY, stinRadius);
                            gradient.addColorStop(0, barva);
                            const transparentniBarva = barva.replace("rgb", "rgba").replace(")", ", 0)");
                            gradient.addColorStop(1, transparentniBarva);

                            ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = gradient;
                            ctx.fillRect(pb.x - stinRadius, pb.y - stinRadius, krok + stinRadius * 2, krok + stinRadius * 2);
                        } else { ctx.globalCompositeOperation = 'source-over'; }
                    }
                }
            });
        }, 0);
        return tile;
    };
    gslTileLayerLeaflet.addTo(map);
}


map.on('zoomend', function() {
    if (document.getElementById("trend_mesic").value !== "NONE") prekresliGslMapu();
});

// =============================================================================
// 4. INTERAKTIVNÍ GRAF S ADAPTIVNÍ OSOU X PODLE HUSTOTY SPEI-6
// =============================================================================
async function nactiGslHistoriiProGraf(lat, lon) {
    const metaGsl = document.getElementById("gsl-meta-info");
    const canvasGsl = document.getElementById("gslGraf");
    const vlastnost = document.getElementById("trend_mesic").value;
    const rokOd = parseInt(document.getElementById("rok_od").value) || START_ROK_TAS;
    const rokDo = parseInt(document.getElementById("rok_do").value) || 2099;
    const trendSegmentVolba = document.getElementById("trend_segment").value;
    const rezimPercentil = document.getElementById("rezim_percentil").checked;
    const zobrazitTrendy = (trendSegmentVolba !== "NONE");
    
    metaGsl.innerHTML = "<i>Buduji komplexní 85letý profil celkového odparu krajiny (EVSPSBL)...</i>";
    if(canvasGsl) canvasGsl.style.display = "none";

    if (aktualniMarker) map.removeLayer(aktualniMarker);
    aktualniMarker = L.marker([lat, lon]).addTo(map);

    try {
        // Voláme centrálního manažera, který dotaz zpracuje z RAM cache nebo přes hromadnou binární frontu
        const surovaDataTas = await gslKlientskaPamet.ziskejDataBodu(lat, lon);

        // --- FILTRACE A OŘEZ DAT PODLE ROZSAHU LET A VOLBY SLEDOVANÉHO OBDOBÍ ---
        const tasHistorie = [];
        const popiskyRokuGrafu = [];
        const indexyMesicuGrafu = [];

        for (let i = 0; i < surovaDataTas.length; i++) {
            const indexRoku = Math.floor(i / 12);
            const rok = START_ROK_TAS + indexRoku;
            const mIdx = i % 12;

            if (rok < rokOd || rok > rokDo) continue;

            if (vlastnost === "ALL") {
                // Celoroční průměr: Spočítá průměrný odpar ze všech 12 měsíců daného roku
                if (mIdx === 0) {
                    let sumRoku = 0, countRoku = 0;
                    for(let m = 0; m < 12; m++) {
                        if (surovaDataTas[i + m] !== null) { sumRoku += surovaDataTas[i + m]; countRoku++; }
                    }
                    tasHistorie.push(countRoku > 0 ? sumRoku / countRoku : null);
                    popiskyRokuGrafu.push(rok);
                    indexyMesicuGrafu.push(0);
                }
            } else if (vlastnost === "CONTINUOUS") {
                // NOVÁ DYNAMIKA: Vloží úplně všechny měsíce lineárně za sebou (Kontinuální řada 1020 kroků)
                tasHistorie.push(surovaDataTas[i]);
                popiskyRokuGrafu.push(rok);
                indexyMesicuGrafu.push(mIdx);
            } else {
                // Izolovaný konkrétní měsíc v roce napříč dekádami
                if (mIdx === parseInt(vlastnost)) {
                    tasHistorie.push(surovaDataTas[i]);
                    popiskyRokuGrafu.push(rok);
                    indexyMesicuGrafu.push(mIdx);
                }
            }
        }

        if(canvasGsl) canvasGsl.style.display = "block";
        const ctx = canvasGsl.getContext("2d");
        ctx.clearRect(0, 0, canvasGsl.width, canvasGsl.height);
        
        const padLeft = 100, padRight = 60, padTop = 60, padBottom = 80;
        const gWidth = canvasGsl.width - padLeft - padRight;
        const gHeight = canvasGsl.height - padTop - padBottom;
        
        // Výpočet dynamické osy Y podle reálných milimetrů evapotranspirace
        let minVal = 600, maxVal = 0;
        tasHistorie.forEach(v => { if (v !== null) { if (v < minVal) minVal = v; if (v > maxVal) maxVal = v; } });
        minVal = Math.max(0, Math.floor(minVal - 5)); maxVal = Math.ceil(maxVal + 5);
        const rozsahY = maxVal - minVal;
        const krokOsyY = rozsahY / 10;
        
        const getGslX = (i) => padLeft + (i / (tasHistorie.length - 1)) * gWidth;
        const getGslY = (val) => padTop + gHeight - ((val - minVal) / rozsahY) * gHeight;
        
        // Horizontální mřížka a orientační rysky osy Y (Přesných 10 dílků, zaokrouhleno na 1 desetinné místo)
        ctx.textAlign = "right"; ctx.textBaseline = "middle"; ctx.font = "14px sans-serif";
        for (let i = 0; i <= 10; i++) {
            const aktY = minVal + (i * krokOsyY);
            ctx.strokeStyle = "rgba(0,0,0,0.35)";
            ctx.beginPath(); ctx.moveTo(padLeft, getGslY(aktY)); ctx.lineTo(padLeft + gWidth, getGslY(aktY)); ctx.stroke();
            ctx.fillStyle = "#555"; ctx.fillText(`${aktY.toFixed(1)} mm`, padLeft - 15, getGslY(aktY));
        }

               // =============================================================================
        // ADAPTIVNÍ OSA X S VERTIKÁLNÍMI LINKAMI PODLE HUSTOTY A ROZLIŠENÍ (OPRAVENO)
        // =============================================================================
        const mesiceNazvy = ["Led", "Úno", "Bře", "Dub", "Kvě", "Čer", "Čec", "Srp", "Září", "Říj", "Lis", "Pro"];
        const sirkaNaBod = gWidth / (tasHistorie.length - 1 || 1);

        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        ctx.font = "12px sans-serif";

        if (vlastnost === "ALL" || (vlastnost !== "ALL" && vlastnost !== "CONTINUOUS")) {
            // =========================================================================
            // REŽIM A: ROČNÍ ROZLIŠENÍ (Celoroční průměr nebo jeden izolovaný měsíc)
            // =========================================================================
            // Určení hustoty textových popisků podle šířky v pixelech, aby se nepřekrývaly
            let krokTextuRoků = 1;
            if (sirkaNaBod < 12)  krokTextuRoků = 2;
            if (sirkaNaBod < 6)   krokTextuRoků = 5;
            if (sirkaNaBod < 3)   krokTextuRoků = 10;
            if (sirkaNaBod < 1.2) krokTextuRoků = 20;

            for (let i = 0; i < tasHistorie.length; i++) {
                const rok = popiskyRokuGrafu[i];
                const xPos = getGslX(i);

                // ZACHOVÁNÍ VŠECH VERTIKÁLNÍCH ČAR: Kreslíme mřížku pro každý jednotlivý rok
                ctx.strokeStyle = (rok % 10 === 0 || i === 0 || i === tasHistorie.length - 1) ? "rgba(0,0,0,0.45)" : "rgba(0,0,0,0.25)";
                ctx.lineWidth = (rok % 10 === 0) ? 1.5 : 0.8;
                ctx.beginPath(); ctx.moveTo(xPos, padTop); ctx.lineTo(xPos, padTop + gHeight); ctx.stroke();

                // DÁVKOVÁNÍ POPISKŮ: Text roku se vypíše jen tehdy, pokud vyhovuje bezpečnému kroku
                if (i === 0 || i === tasHistorie.length - 1 || rok % krokTextuRoků === 0) {
                    
                    // Pokud je to izolovaný měsíc, přidáme k prvnímu/poslednímu/dekádnímu popisku i název měsíce pro kontext
                    let textPopisku = rok;
                    if ((rok % 10 === 0 || i === 0)) {
                        ctx.fillStyle = "#000";
                        ctx.font = "bold 13px sans-serif";
                      if (vlastnost !== "ALL") {  textPopisku = `${rok} (${mesiceNazvy[parseInt(vlastnost)]})`; 
                    ctx.fillText(textPopisku, xPos, padTop + gHeight + 32)
						   } else  {
                    ctx.fillText(rok, xPos, padTop + gHeight + 32)
                    }
                    } else  {// Bezpečný převod na text před oříznutím
                        ctx.fillStyle = "#555";
                        ctx.font = "12px sans-serif";
let vysledek = String(textPopisku).slice(2);
                    ctx.fillText(vysledek, xPos, padTop + gHeight + 12);
                    }
                }
            }
        } else if (vlastnost === "CONTINUOUS") {
            // =========================================================================
            // REŽIM B: KONTINUÁLNÍ MĚSÍČNÍ ROZLIŠENÍ (Všechny měsíce v řadě za sebou)
            // =========================================================================
            const celkemLetVRade = (rokDo - rokOd) + 1;
            
            // Určení kroku pro výpis letopočtů pod osou na základě celkového rozsahu let v řadě
            let krokRokuKontinuální = 1;
            if (celkemLetVRade > 6)   krokRokuKontinuální = 2;
            if (celkemLetVRade > 15)  krokRokuKontinuální = 5;
            if (celkemLetVRade > 35)  krokRokuKontinuální = 10;
            if (celkemLetVRade > 70)  krokRokuKontinuální = 20;

            // Logika pro jemné měsíční linky mezi hlavními roky
            let kreslitMesicniMrizku = (sirkaNaBod > 4);

            for (let i = 0; i < tasHistorie.length; i++) {
                const rok = popiskyRokuGrafu[i];
                const mIndex = indexyMesicuGrafu[i];
                const xPos = getGslX(i);

                if (mIndex === 0) {
                    // SILNÁ VERTIKÁLNÍ ČÁRA PRO KAŽDÝ NOVÝ ROK (V Lednu)
                    ctx.strokeStyle = (rok % 10 === 0) ? "rgba(0,0,0,0.5)" : "rgba(0,0,0,0.25)";
                    ctx.lineWidth = (rok % 10 === 0) ? 1.8 : 1.0;
                    ctx.beginPath(); ctx.moveTo(xPos, padTop); ctx.lineTo(xPos, padTop + gHeight); ctx.stroke();

                    // DÁVKOVANÝ VÝPIS LETOPOČTU: Rok vypíšeme pouze v Lednu vybraného kroku let
                    if (rok === rokOd || rok === rokDo || rok % krokRokuKontinuální === 0) {
                        ctx.fillStyle = "#000";
                        ctx.font = "bold 13px sans-serif";
                        ctx.fillText(rok, xPos, padTop + gHeight + 36);
                    } else  {// Bezpečný převod na text před oříznutím
                        ctx.fillStyle = "#444";
                        ctx.font = "bold 12px sans-serif";
let vysledek = String(rok).slice(2);
                    ctx.fillText(vysledek, xPos, padTop + gHeight + 20);
                    }
                } else if (kreslitMesicniMrizku) {
                    // JEMNÁ VERTIKÁLNÍ MŘÍŽKA PRO MĚSÍCE (Kreslí se pouze tehdy, pokud je na ni v pixelech místo)
                    ctx.strokeStyle = "rgba(0,0,0,0.08)";
                    ctx.lineWidth = 0.5;
                    ctx.beginPath(); ctx.moveTo(xPos, padTop); ctx.lineTo(xPos, padTop + gHeight); ctx.stroke();
                }

                // DOPLŇKOVÉ POPISKY MĚSÍCŮ: Zobrazí názvy měsíců pod osou, pokud je graf extrémně roztažený (malé časové okno)
                if (sirkaNaBod > 35) {
                    ctx.fillStyle = "#666";
                    ctx.font = "11px sans-serif";
                    ctx.fillText(mesiceNazvy[mIndex], xPos, padTop + gHeight + 5);
                } else if (sirkaNaBod > 12 && mIndex % 3 === 0) {
                    // Pokud je střední hustota, vypíšeme alespoň kvartály (Led, Dub, Čec, Říj)
                    ctx.fillStyle = "#777";
                    ctx.font = "10px sans-serif";
                    ctx.fillText(mesiceNazvy[mIndex], xPos, padTop + gHeight + 5);
                } else if (sirkaNaBod > 4 && mIndex === 6) {
                    // U hustější řady vykreslíme jemnou indikační rysku v polovině každého roku (červenec)
                    ctx.strokeStyle = "rgba(0,0,0,0.3)";
                    ctx.lineWidth = 0.8;
                    ctx.beginPath(); ctx.moveTo(xPos, padTop + gHeight); ctx.lineTo(xPos, padTop + gHeight + 6); ctx.stroke();
                }
            }
        }


        // --- ČÁRA A: SUROVÁ MEZIROČNÍ EVAPOTRANSPIRACE (Zelená linie) ---
        ctx.beginPath(); ctx.strokeStyle = "#2e7d32"; ctx.lineWidth = 3;
        let pBodSurovy = true;
        for (let i = 0; i < tasHistorie.length; i++) {
            if (tasHistorie[i] === null) continue;
            if (pBodSurovy) { ctx.moveTo(getGslX(i), getGslY(tasHistorie[i])); pBodSurovy = false; }
            else { ctx.lineTo(getGslX(i), getGslY(tasHistorie[i])); }
        }
        ctx.stroke();

        // --- ČÁRA B: HISTORICKÝ KLOUZAVÝ DYNAMICKÝ AGRO-TREND (Oranžová křivka) ---
        // Výpočet vyhlazovacího okna reaguje na vybranou hodnotu z menu trend_segment
        let k_okno = 5; 
        if (trendSegmentVolba === "0") k_okno = Math.floor(tasHistorie.length / 2);
        else if (trendSegmentVolba !== "NONE") {
            // V měsíčním/celoročním filtru skáčeme po krocích let, v kontinuálním filtru po měsících
            k_okno = vlastnost === "CONTINUOUS" ? Math.floor((parseInt(trendSegmentVolba) * 12) / 2) : Math.floor(parseInt(trendSegmentVolba) / 2);
        }

        const vyhlazenaRadaGsl = [];
        for (let i = 0; i < tasHistorie.length; i++) {
            let sum = 0, c = 0;
            const s = Math.max(0, i - k_okno), k = Math.min(tasHistorie.length - 1, i + k_okno);
            for(let j = s; j <= k; j++) { if(tasHistorie[j] !== null) { sum += tasHistorie[j]; c++; } }
            vyhlazenaRadaGsl.push(c > 0 ? sum / c : null);
        }

        if (zobrazitTrendy) {
            ctx.beginPath(); ctx.strokeStyle = "#e65100"; ctx.lineWidth = 4;
            let pBod = true;
            for (let i = 0; i < vyhlazenaRadaGsl.length; i++) {
                if (vyhlazenaRadaGsl[i] !== null) {
                    if (pBod) { ctx.moveTo(getGslX(i), getGslY(vyhlazenaRadaGsl[i])); pBod = false; }
                    else ctx.lineTo(getGslX(i), getGslY(vyhlazenaRadaGsl[i]));
                }
            }
            ctx.stroke();
        }

        // --- ČÁRA D: HISTORICKÝ PERCENTIL KLIMATICKÉHO OTEPLENÍ ZA CELÉ OBDOBÍ (Černá linie) ---
        if (rezimPercentil) {
            ctx.beginPath(); ctx.strokeStyle = "#000000"; ctx.lineWidth = 3;
            let prvyP = true;
            for (let i = 0; i < tasHistorie.length; i++) {
                if (tasHistorie[i] === null) continue;
                let nNiz = 0; tasHistorie.forEach(v => { if (v !== null && v < tasHistorie[i]) nNiz++; });
                const perc = (nNiz / tasHistorie.length) * rozsahY + minVal;
                if (prvyP) { ctx.moveTo(getGslX(i), getGslY(perc)); prvyP = false; }
                else ctx.lineTo(getGslX(i), getGslY(perc));
            }
            ctx.stroke();
        }
        
        // Načtení souřadnic z textového pole pro dynamický titulek v Canvasu podle vaší šablony
        let latZobraz = lat; let lonZobraz = lon;
        const gpsVstup = document.getElementById('gps_vstup').value;
        if(gpsVstup) {
            const castiGps = gpsVstup.split(',').map(num => parseFloat(num.trim()));
            if(castiGps.length === 2 && !isNaN(castiGps[0])) {
                latZobraz = castiGps[0].toFixed(4);
                lonZobraz = castiGps[1].toFixed(4);
            }
        }
        
        // Načtení textu vybraného období přes selectedOptions[0].text
        const lokalitaSelect = document.getElementById("trend_mesic");
        const val = lokalitaSelect.selectedOptions[0].text;
        
        // Výpočet bilancí a plnění spodního panelu metaGsl podle vaší šablony
        const cddStartTrend = vyhlazenaRadaGsl[0] !== null ? vyhlazenaRadaGsl[0].toFixed(1) : "0";
        const cddKonecTrend = vyhlazenaRadaGsl[vyhlazenaRadaGsl.length - 1] !== null ? vyhlazenaRadaGsl[vyhlazenaRadaGsl.length - 1].toFixed(1) : "0";
        let popisekTrenduText = `Vyhlazený ${trendSegmentVolba} letý klimatický trend`;
        let nazevTrenduProPanel = `${trendSegmentVolba} letém`;
        let zac = ``; let kon = ``; let roz = ``;

        if (trendSegmentVolba !== "NONE") {

        if (trendSegmentVolba === "0") {
            nazevTrenduProPanel = "celoobdobovým";
        }
            zac = `, v ${nazevTrenduProPanel} <b>trendu ${cddStartTrend} mm</b>`;
            kon = `, v ${nazevTrenduProPanel} <b>trendu ${cddKonecTrend} mm</b>`;
            roz = `, v ${nazevTrenduProPanel} <b>trendu je to ${(cddKonecTrend - cddStartTrend).toFixed(1)} mm</b> zvýšení odparu`;
        }

        if (trendSegmentVolba === "0") {
            popisekTrenduText = "Vyhlazený celoobdobový trend"; nazevTrenduProPanel = "5 letém";
        }
    
        // Vykreslení textů a legendy do Canvasu
        ctx.fillStyle = "#333"; ctx.font = "bold 16px sans-serif"; ctx.textAlign = "left";
        ctx.fillText(`${val} (${rokOd} - ${rokDo})`, padLeft, padTop - 45); 
        ctx.fillText("Předpověď celkové evapotranspirace (SSP4-6.0) pro souřadnice lat "+latZobraz+" lon "+lonZobraz+" ", padLeft, padTop - 25);
        ctx.fillStyle = "#2e7d32"; ctx.fillText("■ Meziroční data", padLeft + 700, padTop - 25);
        if (zobrazitTrendy) {
            ctx.fillStyle = "#e65100"; ctx.fillText(`■ ${popisekTrenduText}`, padLeft + 850, padTop - 25);
        }
        if (rezimPercentil) {
            ctx.fillStyle = "#000000"; ctx.fillText("■ Historický percentil za celé období", padLeft + (zobrazitTrendy ? 1150 : 850), padTop - 25);
        }
        
        if (val !== "Všechny měsíce v řadě") {
        metaGsl.innerHTML = `Kliknutím na graf ho zvětšíte a obráceně.<br> <h4 style="margin:10px;text-align: center;">Projekce celkové evapotranspirace do roku 2099 (SSP4-6.0)</h4> Rok ${rokOd} měl v ${val} <b>${tasHistorie[0].toFixed(1)} mm</b>${zac}. <br> V roce ${rokDo} předpověď odhaduje <b>${tasHistorie[tasHistorie.length - 1].toFixed(1)} mm</b>${kon}. <br> Rozdíl v průměrném odparu mezi těmito roky je <b>${(tasHistorie[tasHistorie.length - 1] - tasHistorie[0]).toFixed(1)} mm</b>${roz}.`;
 } else {
        metaGsl.innerHTML = `Kliknutím na graf ho zvětšíte a obráceně.`;
    }
 
    } catch (err) {
        metaGsl.innerHTML = `<span style="color:#d32f2f;">Projekční graf: ${err.message}</span>`;
    }
}

// Inicializační spouštěč po úplném načtení DOM stromu webu
document.addEventListener("DOMContentLoaded", function() {
    prekresliGslMapu();
    panel.style.display = "flex";
});
